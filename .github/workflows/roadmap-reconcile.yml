name: roadmap-reconcile

# Reconcile roadmap/roadmap-state.yaml against GitHub and commit the snapshot.
#
# Read-only against every other repository: the only writes are this repo's own
# roadmap/snapshot.json and roadmap/ROADMAP.md.
#
# The schedule matters more than it looks. A watcher fires on events and is
# silent the rest of the time, so a broken watcher and a quiet org produce the
# same output — that is how six pull requests went unannounced for six hours on
# 2026-09-11. A reconciler runs whether or not anything happened and reports the
# state it found, including OBSERVATION_FAILED when it could not look. Silence
# from this workflow means the workflow did not run, which the schedule below
# makes visible on its own.

on:
  schedule:
    # Four times a day. Frequent enough that a day's drift is caught the same
    # day, rare enough that the committed snapshot is not a noise generator.
    - cron: "0 6,11,16,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "roadmap/roadmap-state.yaml"
      - "roadmap/reconcile.py"
      - ".github/workflows/roadmap-reconcile.yml"

permissions:
  contents: write

concurrency:
  group: roadmap-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Self-test the reconciler
        # Runs before the real pass, and gates it. The property being protected
        # is that a failed observation can never read as a zero or an absence;
        # a reconciler that lost it would report a green roadmap while blind.
        run: python3 roadmap/reconcile.py --selftest

      - name: When did this reconciler last run
        id: history
        # From the workflow's own run history, not from the snapshot. The
        # snapshot is committed only when the state changes, so its timestamp
        # records the last change; a quiet roadmap would have read as a
        # growing outage forever. This advances on every run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          previous=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/roadmap-reconcile.yml/runs?status=success&per_page=5" \
            --jq "[.workflow_runs[] | select(.id != ${RUN_ID}) | .created_at] | first // empty" \
            2>/dev/null || true)
          echo "previous_run_at=${previous}" >> "$GITHUB_OUTPUT"
          echo "previous successful run: ${previous:-none recorded}"

      - name: Reconcile
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_RUN_AT: ${{ steps.history.outputs.previous_run_at }}
        run: |
          # The committed snapshot is copied aside first. reconcile.py reads
          # --previous before writing --json for exactly this reason, but
          # handing it two different paths means the comparison does not
          # depend on that ordering holding forever.
          cp roadmap/snapshot.json "$RUNNER_TEMP/previous.json" 2>/dev/null || true
          set +e
          python3 roadmap/reconcile.py \
            --state roadmap/roadmap-state.yaml \
            --json roadmap/snapshot.json \
            --markdown roadmap/ROADMAP.md \
            --previous "$RUNNER_TEMP/previous.json" \
            ${PREVIOUS_RUN_AT:+--previous-run-at "$PREVIOUS_RUN_AT"}
          code=$?
          set -e
          # 0 aligned, 1 something diverged — both are results worth
          # publishing. 2 means the run could not be completed, and a
          # reconciler that could not look must fail loudly rather than
          # publish a page implying it did.
          if [ "$code" -ge 2 ]; then
            echo "::error::reconcile could not complete (exit $code) — this is the tool, not the roadmap"
            exit "$code"
          fi

      - name: Commit the snapshot
        # Only when the reconciled state actually changed. snapshot.json
        # carries the run's timestamp, so it differs on every pass and a
        # content guard could never be true — this repo would have taken four
        # commits a day saying nothing.
        if: steps.reconcile.outputs.changed == 'true'
        run: |
          if git diff --quiet -- roadmap/snapshot.json roadmap/ROADMAP.md; then
            echo "no change to publish"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roadmap/snapshot.json roadmap/ROADMAP.md
          git commit -m "chore(roadmap): reconcile ${OVERALL}"
          # Two scheduled runs can overlap a manual push to main. Rebase and
          # retry rather than losing the snapshot to a race.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase --autostash
          done
          echo "::error::could not push the snapshot after three attempts"
          exit 1
        env:
          OVERALL: ${{ steps.reconcile.outputs.overall }}

      - name: Report
        # Three different things can be wrong, and they are not the same
        # message. A failed job is used rather than `::warning::` because an
        # annotation on a scheduled run reaches nobody — it sits in a log
        # somebody would have to already be reading.
        #
        # Blindness is announced on EVERY run, not only when it changes: a
        # partially visible org would otherwise announce once and then go
        # quiet behind a permanently half-red page, which is the failure this
        # whole tool argues against.
        if: >-
          steps.reconcile.outputs.unobserved != '0' ||
          steps.reconcile.outputs.stale_hours != '0' ||
          (steps.reconcile.outputs.changed == 'true' &&
           steps.reconcile.outputs.overall != 'ALIGNED')
        env:
          OVERALL: ${{ steps.reconcile.outputs.overall }}
          UNOBSERVED: ${{ steps.reconcile.outputs.unobserved }}
          STALE_HOURS: ${{ steps.reconcile.outputs.stale_hours }}
        run: |
          if [ "$UNOBSERVED" != "0" ]; then
            echo "::error::${UNOBSERVED} roadmap item(s) could not be observed — this is the tool or its access, not the roadmap"
          fi
          if [ "$STALE_HOURS" != "0" ]; then
            echo "::error::this reconciler did not run for ${STALE_HOURS}h — the roadmap was unobserved for that window"
          fi
          if [ "$UNOBSERVED" = "0" ] && [ "$STALE_HOURS" = "0" ]; then
            echo "::error::roadmap state changed to ${OVERALL} — something we believed is no longer true"
          fi
          exit 1
