name: Agy formal review dispatch
run-name: Agy formal review ${{ inputs.repository }}#${{ inputs.pr_number }} @ ${{ inputs.head_sha || inputs.queue_head_sha || 'any' }} [${{ inputs.check_name }}:${{ inputs.gate_mode }}]

# Bootstrap/recovery entrypoint: trusted default-branch code can review the
# pilot PR before a caller has been installed in that repository. Also invoked
# by review-gate-controller.yml when Claude ends with NO_VERDICT_TRANSIENT or SELF_EDIT.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Same-owner public repository installed on the reviewer App
        type: string
        required: true
        default: mctlhq/mctl-gitops
      pr_number:
        description: Open non-draft PR number
        type: number
        required: true
      head_sha:
        description: Optional PR head SHA to pin (skips if PR moved)
        type: string
        default: ''
      check_name:
        description: Target check context (agy-formal-review or independent-review)
        type: string
        default: 'agy-formal-review'
      gate_mode:
        description: Gate mode (enforce or shadow)
        type: string
        default: 'enforce'
      # Set together by mctl-gitops' merge_group caller (mctlhq/.github#351);
      # empty for an ordinary PR-head review.
      queue_head_ref:
        description: Merge queue ref (refs/heads/gh-readonly-queue/...), or empty
        type: string
        default: ''
      queue_head_sha:
        description: Merge queue commit to review, or empty
        type: string
        default: ''
      queue_base_sha:
        description: Merge queue base commit, or empty
        type: string
        default: ''
permissions: {}
jobs:
  formal:
    uses: ./.github/workflows/agy-formal-review.yml
    secrets:
      AGY_REVIEW_APP_PRIVATE_KEY: ${{ secrets.AGY_REVIEW_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    with:
      repository: ${{ inputs.repository }}
      pr_number: ${{ fromJSON(inputs.pr_number) }}
      head_sha: ${{ inputs.head_sha }}
      check_name: ${{ inputs.check_name }}
      gate_mode: ${{ inputs.gate_mode }}
      queue_head_ref: ${{ inputs.queue_head_ref }}
      queue_head_sha: ${{ inputs.queue_head_sha }}
      queue_base_sha: ${{ inputs.queue_base_sha }}
