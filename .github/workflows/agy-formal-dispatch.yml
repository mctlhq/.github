name: Agy formal review dispatch

# Bootstrap/recovery entrypoint: trusted default-branch code can review the
# pilot PR before a caller has been installed in that repository.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Same-owner public repository installed on the reviewer App
        type: string
        required: true
        default: mctlhq/mctl-gitops
      pr_number:
        description: Open non-draft PR number
        type: number
        required: true
      # Set together by mctl-gitops' merge_group caller (mctlhq/.github#351);
      # empty for an ordinary PR-head review.
      queue_head_ref:
        description: Merge queue ref (refs/heads/gh-readonly-queue/...), or empty
        type: string
        default: ''
      queue_head_sha:
        description: Merge queue commit to review, or empty
        type: string
        default: ''
      queue_base_sha:
        description: Merge queue base commit, or empty
        type: string
        default: ''
permissions: {}
jobs:
  formal:
    uses: ./.github/workflows/agy-formal-review.yml
    secrets:
      AGY_REVIEW_APP_PRIVATE_KEY: ${{ secrets.AGY_REVIEW_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      actions: read
      pull-requests: write
    with:
      repository: ${{ inputs.repository }}
      pr_number: ${{ fromJSON(inputs.pr_number) }}
      queue_head_ref: ${{ inputs.queue_head_ref }}
      queue_head_sha: ${{ inputs.queue_head_sha }}
      queue_base_sha: ${{ inputs.queue_base_sha }}
