name: Roadmap publication

# Publishes one RoadmapPublication (mctlhq/.github#119) to the generated
# `roadmap-state` branch: the canonical evaluator runs here and only here, and
# consumers (mctl-api#333) read the result instead of evaluating.
#
# `roadmap-state` is GENERATED STATE: one commit per successful publication,
# never edited by hand, never the planning source. The manifests on `main` and
# GitHub stay the desired graph.
#
# A run that cannot observe, evaluate, validate or verify fails and pushes
# nothing, so the last publication keeps its older capturedAt and never looks
# fresher than the last observation that actually succeeded.

# Triggers, and what each is for (roadmap/README.md, "Publication freshness"):
#
#   push               a manifest or the evaluator changed on main
#   workflow_dispatch  something changed the graph without touching main: a
#                      governed apply requests one after a landed write
#                      (roadmap/scripts/publication_request.py), and an operator
#                      requests one before planning a wave
#   schedule           reconciliation for everything else that moves the graph
#                      (an issue closed in any repository). It captures only
#                      when the publication is older than 90 minutes or from
#                      another revision, so an event-driven publication is not
#                      re-captured an hour later for nothing.
#
# One capture costs `publish.py cost` GETs (545 on 2026-09-23: 9 repositories +
# 4 x 134 issues). The build job reads the token's remaining budget first and
# refuses to start a capture it cannot finish.

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main
    paths:
      - 'roadmap/**'
      - '.github/workflows/roadmap-publish.yml'
  workflow_dispatch:

permissions: {}

# One publisher at a time, in order: a newer run waits instead of racing an
# older one to the branch.
concurrency:
  group: roadmap-publication
  cancel-in-progress: false

jobs:
  # Everything that runs third-party code (pip) or talks to the GitHub API
  # holds a read-only token. Only the final job can write, and it runs no
  # installed package: git, cp and the runner's stdlib python.
  build:
    if: github.repository == 'mctlhq/.github'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    outputs:
      capture: ${{ steps.due.outputs.capture }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      # Only the schedule asks. A push or a dispatch was started because
      # something changed, so it always captures.
      - name: Decide whether this run captures
        id: due
        env:
          EVENT: ${{ github.event_name }}
          STATE: ${{ runner.temp }}/published
        run: |
          capture=true
          if [ "$EVENT" = schedule ] \
            && git fetch --depth=1 origin roadmap-state 2>/dev/null \
            && mkdir -p "$STATE" \
            && git show FETCH_HEAD:publication.json > "$STATE/publication.json" \
            && python3 roadmap/scripts/publication_order.py fresh "$STATE" \
                 --revision "$(git rev-parse HEAD)" --max-age 5400; then
            capture=false
          fi
          echo "capture=$capture" >> "$GITHUB_OUTPUT"

      - name: Install roadmap evaluator dependencies
        if: steps.due.outputs.capture == 'true'
        run: python3 -m pip install --disable-pip-version-check -r roadmap/requirements.txt

      # GET /rate_limit is free. A capture that runs out of budget part-way
      # fails and publishes nothing, which is safe but wastes what it spent and
      # starves the next run; refusing up front keeps the budget for a run that
      # can finish.
      - name: Check the API budget covers one capture
        if: steps.due.outputs.capture == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cost="$(python3 roadmap/scripts/publish.py cost)"
          read -r limit remaining reset < <(gh api rate_limit --jq '.resources.core | "\(.limit) \(.remaining) \(.reset)"')
          echo "capture cost ${cost} GETs; core budget ${remaining}/${limit}, resets $(date -u -d "@${reset}" +%H:%M:%SZ)"
          if [ "$remaining" -lt "$cost" ]; then
            echo "::error::${remaining} GETs left of ${limit}, a capture needs ${cost}; nothing is captured or published. roadmap-state keeps its older capturedAt."
            exit 1
          fi

      # Manifests and evaluator come from the same checkout, so the source and
      # evaluator revisions are the same commit.
      - name: Capture and evaluate
        if: steps.due.outputs.capture == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          revision="$(git rev-parse HEAD)"
          python3 roadmap/scripts/publish.py build --live \
            --output "$RUNNER_TEMP/publication" \
            --evaluator-revision "$revision" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-ref main \
            --source-revision "$revision"

      - name: Report the API budget after the capture
        if: steps.due.outputs.capture == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api rate_limit --jq '.resources.core | "core budget \(.remaining)/\(.limit) left"'

      - name: Verify the publication reproduces from its own snapshot
        if: steps.due.outputs.capture == 'true'
        run: python3 roadmap/scripts/publish.py verify "$RUNNER_TEMP/publication"

      - name: Stage the branch README
        if: steps.due.outputs.capture == 'true'
        run: cp roadmap/publication/README.md "$RUNNER_TEMP/publication/README.md"

      - name: Hand the publication to the publish job
        if: steps.due.outputs.capture == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roadmap-publication
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: needs.build.outputs.capture == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Push to this repository's own roadmap-state branch. Nothing else.
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: main
          fetch-depth: 1

      - name: Receive the publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: roadmap-publication
          path: ${{ runner.temp }}/publication

      - name: Commit to roadmap-state
        env:
          PUBLICATION: ${{ runner.temp }}/publication
          WORKTREE: ${{ runner.temp }}/roadmap-state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin roadmap-state >/dev/null; then
            git fetch --depth=1 origin roadmap-state
            git worktree add -B roadmap-state "$WORKTREE" FETCH_HEAD
          else
            git worktree add --orphan -b roadmap-state "$WORKTREE"
          fi
          # Never move capturedAt backwards: a queued run can hold a capture
          # that a later-started run has already published past. Overtaken is
          # not a failure (exit 1, nothing to do); an invalid candidate is.
          order=0
          python3 roadmap/scripts/publication_order.py newer "$WORKTREE" "$PUBLICATION" || order=$?
          if [ "$order" -eq 1 ]; then
            echo "::notice::a newer publication is already on roadmap-state; this capture is not pushed"
            exit 0
          elif [ "$order" -ne 0 ]; then
            exit "$order"
          fi
          # Replace the whole tree: the branch holds exactly one publication.
          git -C "$WORKTREE" rm -rq --ignore-unmatch .
          cp "$PUBLICATION"/*.json "$PUBLICATION"/README.md "$WORKTREE"/
          git -C "$WORKTREE" add -A
          # Only a replayed snapshot can repeat bytes: every live capture has
          # its own capturedAt, so a live run always commits.
          if git -C "$WORKTREE" diff --cached --quiet; then
            echo "publication unchanged; nothing to commit"
            exit 0
          fi
          # The message names the publication's own provenance, not this
          # job's checkout: main may have moved since the build job ran.
          message="$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); print("publish: roadmap captured %s from %s" % (p["observation"].get("capturedAt", "synthetic"), p["source"]["revision"][:12]))' "$PUBLICATION/publication.json")"
          git -C "$WORKTREE" commit -q -m "$message"
          # Never force: a rejected push means another publisher moved the
          # branch, and failing loudly is the right answer.
          git -C "$WORKTREE" push origin roadmap-state
