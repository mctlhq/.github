name: pr-steward model usage

# The pr-steward's scheduled ticks (mctlhq/mctl-claude-remote) are the paid,
# model-backed remediation half of a fix-only DevLoop, so their spend belongs
# in the usage ledger next to the other stages (mctlhq/.github#50, ADR-012 in
# mctlhq/mctl-agents). The steward's pod cannot hold a ledger credential (its
# model runs with --dangerously-skip-permissions and can read anything on
# disk), so it sends its records here as a repository_dispatch, using the
# steward App token it already has. This workflow turns them into the same
# `model-usage-records` artifact the reviewer publishes, and the in-cluster
# usage collector, which already sweeps this repository, ingests it.
#
# The payload is untrusted input. Only the steward App may send it, the
# records are projected onto a fixed allowlist, agent and stage are set here
# rather than taken from the payload, and anything malformed is dropped. The
# collector and mctl-api validate again at ingest, and the ledger dedupes on
# (session_id, result_uuid, model_key), so a redelivered dispatch adds nothing.

on:
  repository_dispatch:
    types: [pr-steward-usage]

permissions: {}

jobs:
  publish:
    if: github.event.sender.login == 'mctl-claude-remote[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Each record is projected onto the allowlist below; at most 20 accepted
      # records are kept (the cap applies after validation, so malformed
      # entries cannot displace valid ones). Absent stays absent: a counter
      # that is missing, not a non-negative integer, or above a plausible
      # ceiling is dropped, never set to 0. No cost field is accepted: the
      # ledger prices the token counts from its own catalog at ingest.
      # model_key is restricted to a model-id charset, so it can be written
      # into the step summary table unescaped.
      STEWARD_USAGE_JQ: |
        def count: if type == "number" and . >= 0 and . == floor then . else null end;
        def tokens: count | if . != null and . > 1000000000 then null else . end;
        def small: count | if . != null and . > 100000 then null else . end;
        def modelkey: if type == "string" and length <= 200 and test("^[A-Za-z0-9._:@/-]+$") then . else null end;
        def text: if type == "string" and . != "" and length <= 200 then . else null end;
        def repo: if type == "string" and test("^mctlhq/[A-Za-z0-9_.-]+$") then . else null end;
        (if type == "object" then .records else null end)
        | (if type == "array" then . else [] end)
        | map(select(type == "object"))
        | map({
            schema_version: 1,
            session_id: (.session_id | text),
            result_uuid: (.result_uuid | text),
            model_key: (.model_key | modelkey),
            canonical_model: (.canonical_model | text),
            provider: (.provider | text),
            agent: "pr-steward",
            devloop_stage: "shepherd",
            target_repo: (.target_repo | repo),
            pr_number: (.pr_number | count | if . == 0 then null else . end),
            input_tokens: (.input_tokens | tokens),
            output_tokens: (.output_tokens | tokens),
            cache_read_tokens: (.cache_read_tokens | tokens),
            cache_write_tokens: (.cache_write_tokens | tokens),
            web_search_requests: (.web_search_requests | small),
            outcome: (.outcome | if . == "success" or . == "error" then . else null end),
            api_error_status: (.api_error_status | text),
            stop_reason: (.stop_reason | text),
            terminal_reason: (.terminal_reason | text),
            num_turns: (.num_turns | small),
            duration_api_ms: (.duration_api_ms | count),
            retry_attempt: (.retry_attempt | small),
            recorded_at: (.recorded_at | text)
          }
          | if .target_repo == null then del(.pr_number) else . end
          | with_entries(select(.value != null)))
        | map(select(.session_id != null and .model_key != null))
        | .[:20]
        | {records: .}
    steps:
      - name: Validate steward usage records
        id: usage
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          dir="$RUNNER_TEMP/model-usage"
          mkdir -p "$dir"
          printf '%s' "$PAYLOAD" | jq "$STEWARD_USAGE_JQ" > "$dir/model-usage-records.json"
          count=$(jq '.records | length' "$dir/model-usage-records.json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### pr-steward model usage"
            echo
            echo "Stage \`shepherd\`. Absent counters are shown as — (not measured), never as 0."
            echo
            echo "| model | repo | PR | outcome | input | output | cache read | cache write |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- |"
            jq -r '.records[]
              | [.model_key, (.target_repo // "—"), (.pr_number // "—"), (.outcome // "—"),
                 (.input_tokens // "—"), (.output_tokens // "—"),
                 (.cache_read_tokens // "—"), (.cache_write_tokens // "—")]
              | map(tostring) | "| " + join(" | ") + " |"' \
              "$dir/model-usage-records.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload steward model usage records
        if: steps.usage.outputs.count != '' && steps.usage.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-usage-records
          path: ${{ runner.temp }}/model-usage/model-usage-records.json
          if-no-files-found: error
          retention-days: 90
