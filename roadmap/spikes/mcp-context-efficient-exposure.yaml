apiVersion: roadmap.mctl.ai/v1alpha1
kind: SpikeDefinition
metadata:
  name: mcp-context-efficient-exposure
  owner: mctlhq/mctl-agents
spec:
  title: Benchmark context-efficient tool exposure on real workloads
  question: >-
    Does progressive capability discovery cut end-to-end cost on real
    mcp.mctl.ai tasks while keeping success rate, authorization and audit
    intact?
  lifecycle: parked
  github:
    issue:
      repository: mctlhq/mctl-agents
      number: 597
  outcomes:
    - ADOPT_MCTL_NATIVE
    - ADOPT_PORTAL_MODE
    - HYBRID
    - DEFER
  activation:
    trigger: >-
      .github#195 records its verdict (it decides whether a portal mode still
      exists), or the enterprise-mcp epic is resumed.
    reviewBy: "2026-12-15"
