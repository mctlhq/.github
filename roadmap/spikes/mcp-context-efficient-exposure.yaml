# Re-scoped 2026-10-27 (owner triage of parked spikes). The trigger fired:
# .github#195 closed and its re-check (.github#235) gave GO to the mcp-gateway
# epic, which replaces the Cloudflare portal, so the portal-mode outcomes no
# longer exist. The question moves to the gateway's merged catalogue, which is
# where tool-schema size now accumulates, and waits until that catalogue
# serves real traffic.
apiVersion: roadmap.mctl.ai/v1alpha1
kind: SpikeDefinition
metadata:
  name: mcp-context-efficient-exposure
  owner: mctlhq/mctl-agents
spec:
  title: Benchmark context-efficient tool exposure through the MCP gateway
  question: >-
    Does progressive capability discovery in the mcp-gateway's merged
    catalogue cut end-to-end cost on real mcp.mctl.ai tasks, compared with
    eager exposure, while keeping success rate, per-principal authorization
    and audit intact?
  lifecycle: parked
  # The issue is also work item tool-exposure-benchmark of the enterprise-mcp
  # epic (roadmap/epics/enterprise-mcp.yaml, mctlhq/.github#166), so the spike
  # declares that binding.
  epic:
    name: enterprise-mcp
    workItem: tool-exposure-benchmark
  github:
    issue:
      repository: mctlhq/mctl-agents
      number: 597
  outcomes:
    - ADOPT_PROGRESSIVE_DISCOVERY
    - KEEP_EAGER_EXPOSURE
    - HYBRID
    - DEFER
  activation:
    trigger: >-
      mcp-gateway G2 (.github#238) serves api and coolify through the gateway
      in production, so the benchmark measures the real merged catalogue.
    reviewBy: "2027-01-31"
