apiVersion: roadmap.mctl.ai/v1alpha1
kind: SpikeDefinition
metadata:
  name: tg-mcp-app-live-validation
  owner: mctlhq/mctl-telegram
spec:
  title: Validate the Telegram MCP App live and set the connector-submission position
  question: >-
    Do the supported hosts and the MCP portal render and safely execute the
    Telegram MCP App well enough to support a connector submission?
  lifecycle: parked
  github:
    issue:
      repository: mctlhq/mctl-telegram
      number: 650
  epic:
    name: enterprise-mcp
    workItem: mcp-apps-validation
  outcomes:
    - SUBMIT_READY
    - SUBMIT_WITH_LIMITATIONS
    - NOT_READY
  activation:
    trigger: >-
      An operator session is scheduled with a throwaway test identity, running
      mctl-telegram#616 first.
    reviewBy: "2026-11-30"
