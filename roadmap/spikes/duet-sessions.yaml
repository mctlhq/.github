apiVersion: roadmap.mctl.ai/v1alpha1
kind: SpikeDefinition
metadata:
  name: duet-sessions
  owner: mctlhq/mctl-agents
spec:
  title: Persistent proactive agent sessions and attention routing
  question: >-
    Does MCTL need a first-class persistent proactive agent session contract, or
    do existing Temporal, policy, approval and event primitives suffice?
  lifecycle: parked
  github:
    issue:
      repository: mctlhq/mctl-agents
      number: 757
  outcomes:
    - NO_NEW_CONTRACT
    - EXTEND_DEVLOOP_SESSION
    - ADD_AGENT_SESSION_CONTRACT
    - CREATE_PROACTIVE_AGENT_EPIC
  activation:
    trigger: >-
      mctlhq/mctl-agents#746 (portable runtime) records its decision verdict;
      both spikes touch the agent-runtime boundary. First slice, once
      activated: AttentionDecision v1 on the claude-remote channel.
    reviewBy: "2026-11-30"
