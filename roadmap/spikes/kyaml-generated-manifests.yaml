apiVersion: roadmap.mctl.ai/v1alpha1
kind: SpikeDefinition
metadata:
  name: kyaml-generated-manifests
  owner: mctlhq/mctl-gitops
spec:
  title: KYAML canonicalization for machine-generated manifests
  question: >-
    Does canonical KYAML materially improve determinism and review quality
    for manifests generated by agents and tooling?
  lifecycle: parked
  github:
    issue:
      repository: mctlhq/mctl-gitops
      number: 1044
  outcomes:
    - ADOPT
    - LIMITED
    - REJECT
  activation:
    trigger: >-
      A recorded incident where agent-generated YAML coerced a scalar type or
      produced a noisy diff, or the pinned kubectl gains a stable -o kyaml.
    reviewBy: "2027-01-31"
