# Decided by the owner from the findings on mctlhq/mctl-telegram#784
# (2026-10-27): the tool descriptors already carry most host guidance; a
# prototype skill helped only on a trap task, and that content belongs in MCP
# server instructions, which reach every host from the same release. No
# CLI-shaped gap was found, so no CLI was prototyped. Follow-ups stay under #770.
apiVersion: roadmap.mctl.ai/v1alpha1
kind: SpikeDefinition
metadata:
  name: tg-agent-platform-packaging
  owner: mctlhq/mctl-telegram
spec:
  title: Package tg.mctl.ai as the Telegram capability layer for agent platforms
  question: >-
    Which packaging of tg.mctl.ai measurably shortens integration for
    external agent platforms: the MCP server alone, MCP plus skills, or MCP
    plus a CLI and skills?
  lifecycle: decided
  github:
    issue:
      repository: mctlhq/mctl-telegram
      number: 784
  outcomes:
    - MCP_ONLY
    - MCP_PLUS_SKILLS
    - MCP_PLUS_CLI_AND_SKILLS
  timebox:
    decisionBy: "2026-11-06"
  execution:
    devloop: true
  decision:
    verdict: MCP_ONLY
    decidedAt: "2026-10-27"
    decidedBy: mashkovd
    followUps:
      - repository: mctlhq/mctl-telegram
        number: 881
      - repository: mctlhq/mctl-telegram
        number: 882
      - repository: mctlhq/mctl-telegram
        number: 883
      - repository: mctlhq/mctl-telegram
        number: 884
