  # ── Context platform ──────────────────────────────────────────────────
  - id: context.snapshot-contract
    title: ContextSnapshot contract
    epic: mctlhq/.github#20
    issue: mctlhq/mctl-agents#264
    phase: done
    expected:
      issue: closed
    note: >-
      Merged as f9efb074 on 2026-09-11 21:09Z. The contract is accepted; what
      the review could not settle went to mctl-agents#347, chiefly whether
      `truncated` means "the budget was exhausted" or "something did not make
      it in" -- today an honest snapshot that drops an oversized candidate
      fails its own validation unless it claims a truncation that did not
      happen.

  - id: context.work-item
