# Desired state of the mctlhq roadmap.
#
# This file is the input to roadmap/reconcile.py. It declares what we believe
# to be true, per roadmap item; the reconciler observes GitHub and reports
# where belief and reality disagree. Nothing here describes events ("a PR
# appeared", "an issue closed") — only assertions about state, because an
# event stream cannot tell "nothing happened" apart from "I failed to look".
#
# Org project #1 "mctl.ai — Roadmap" stays the roadmap of record for
# priority and status; this file is narrower on purpose. It carries only the
# claims worth being woken up about, and it is the source of roadmap/ROADMAP.md.
#
# Editing rules
# -------------
# * `expected` is what SHOULD be true now. When reality changes because we
#   decided it should, edit this file in the same PR as the change. A DRIFT
#   report is either a real divergence or a stale line here — both need a
#   human, which is the point.
# * `phase` drives the generated page only (done / now / next / later).
# * `max_silence` is how long an item may show no observable movement before
#   that silence is itself reported. Omit it for items where silence is
#   correct (a `later` item nobody is working on).
# * Probes assert things GitHub's issue state cannot: a file's contents, a
#   count of opted-in services. A probe that cannot be evaluated is an
#   OBSERVATION_FAILED, never a zero.

version: 1

defaults:
  # Long enough that an overnight gap is not noise, short enough that a
  # workday of silence on something we believe is being implemented is
  # surfaced the same day.
  max_silence: 12h

items:
  # ── Agent platform ────────────────────────────────────────────────────
  - id: agent-platform.registry
    title: Registry-backed ReleaseBinding
    epic: mctlhq/.github#18
    issue: mctlhq/mctl-api#283
    phase: now
    expected:
      issue: open
      implementation: active
      # Two acceptable answers, because both are this situation: the author
      # pushes a fix and the head is briefly unreviewed, then the reviewer
      # answers again. Declaring only one would report drift on every push
      # and teach everyone to ignore the report.
      review: [blocking-findings, unreviewed-head]
      merge: [blocked-review, blocked-review-required]
    max_silence: 6h
    note: >-
      The declarative agent architecture is a project rather than a production
      path until this lands: GitOps carries shadow ReleaseBindingIntent with
      promotable:false, and the resolver refuses to proceed on
      bindingSource: registry.
    unlocks:
      - investigator.declarative-activation
      - agent-platform.capability-discovery

  - id: investigator.declarative-activation
    title: Investigator resolver off legacy
    epic: mctlhq/.github#18
    phase: next
    # The assertion lives entirely in the probe below. A prose line under
    # `expected:` here would read like a second assertion and check nothing.
    probes:
      - id: resolver-mode-in-gitops
        kind: dir_file_match_count
        repo: mctlhq/mctl-gitops
        path: platform-gitops/argo-workflows/cluster-templates
        file_pattern: '^cwft-mctl-agents-investigate\.yaml$'
        # The env var is absent today, and the code default is "legacy"
        # (orchestrator/run_issue_investigator.py). Absent therefore means
        # legacy, which is why this asserts on the value being SET, not on
        # the absence of the opposite.
        content_pattern: 'ISSUE_INVESTIGATOR_RESOLVER_MODE\s*\n\s*value:\s*"?declarative"?'
        expect: '== 1'
    note: >-
      Activation is blocked on mctl-gitops#950 per the code comment, and on
      agent-platform.registry for the binding source. Expected to be failing
      until both land — this item exists so that the day it flips is observed
      rather than noticed.

