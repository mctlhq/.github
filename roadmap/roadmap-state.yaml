  # ── Client lifecycle ──────────────────────────────────────────────────
  - id: client-lifecycle.identity-attributes
    title: Identity attributes and profile
    epic: mctlhq/.github#22
    issue: mctlhq/mctl-telegram#620
    phase: now
    expected:
      issue: open
      implementation: active
      # The pair, for the same reason as the merge axis below: the one fix
      # for `blocked-behind-base` is to update the branch, which moves the
      # head and leaves it reviewed by nobody until someone re-approves. With
      # `clean` alone this item reported drift every time somebody did the
      # right thing, and again when they finished — under `strict`, at the
      # frequency main moves.
      #
      # The cost, named rather than hidden: `unreviewed-head` is decided
      # before the decisions are read, so this pair covers BOTH "an approval
      # that has stopped covering the head" and "changes requested on an
      # older commit, not yet re-cast" — the second being a negative verdict,
      # not a lapsed positive one. It is the right trade only while the merge
      # axis is already saying the PR is not mergeable, which is what keeps
      # the item from reading as ready.
      review: [clean, unreviewed-head]
      # Not `ready`: approved and green, and still unmergeable. Two answers
      # are legitimate and it alternates between them — mctl-telegram's main
      # requires review conversations to be resolved AND is `strict`, so the
      # branch falls behind every time main moves.
      merge: [blocked-conversations, blocked-behind-base]
      # `conflicted` is deliberately NOT in the list. The first two are
      # states the PR moves through on its own; conflicts are work somebody
      # has to do, and a row that reports them is the row doing its job.
    max_silence: 12h
    note: >-
      Approved, green, and not mergeable. Which reason holds alternates —
      unresolved review conversations, or the branch behind a `strict` main —
      so the snapshot's `merge` field is the thing to read, not this sentence.
      As of 2026-09-12 it is neither: the branch now CONFLICTS with main,
      which is work rather than a state it moves through. It also carries steward:escalated, terminal for
      pr-steward: that label has to be cleared by a human before the
      lifecycle resumes, so silence here needs a person rather than time.

