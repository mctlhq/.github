  # ── Observability ─────────────────────────────────────────────────────
  - id: observability.collector
    title: OTel Collector traces gateway
    epic: mctlhq/.github#55
    issue: mctlhq/mctl-gitops#902
    phase: done
    expected:
      issue: closed

  - id: observability.producers
    title: At least one service emitting spans
    epic: mctlhq/.github#55
    phase: now
    probes:
      - id: services-opted-into-otel
        kind: dir_file_match_count
        repo: mctlhq/mctl-gitops
        path: platform-gitops/services
        file_pattern: 'values\.yaml$'
        content_pattern: '(?ms)^otel:\s*\n(?:\s+.*\n)*?\s+enabled:\s*true'
        expect: '>= 1'
    note: >-
      The transport shipped with #902, but otel.enabled is false everywhere
      and otelCollector.backendEndpoint is empty, so end-to-end traces are
      still zero. This item is the observability critical path now, not the
      collector.

