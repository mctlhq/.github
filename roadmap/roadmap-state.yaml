      review: clean
      # Not `ready`: approved and green, and still unmergeable. mctl-telegram's
      # main requires review conversations to be resolved, and fourteen are
      # open. Declared so the page states the reason rather than showing an
      # approved PR that looks mergeable and is not.
      merge: blocked-conversations
    max_silence: 12h
    note: >-
      Approved on the current head, every check green, blocked on unresolved
      review conversations. Also carries steward:escalated, which is terminal
      for pr-steward: that label has to be cleared by a human before the
      lifecycle resumes, so silence here needs a person rather than time.

