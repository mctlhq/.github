  - id: observability.producers
    title: At least one service emitting spans
    epic: mctlhq/.github#55
    phase: now
    probes:
      - id: services-opted-into-otel
        # Parsed, not pattern-matched. Two regexes in two review rounds asked
        # this question wrong: the first let `.` cross a top-level key, the
        # second accepted any indent so a nested `metrics.enabled: true`
        # satisfied it, and both returned zero on a blank line inside the
        # block. A key path cannot drift from the structure it describes.
        kind: dir_file_yaml_value_count
        repo: mctlhq/mctl-gitops
        path: platform-gitops/services
        file_pattern: 'values\.yaml$'
        key: otel.enabled
        equals: true
        expect: '>= 1'
    note: >-
      The transport shipped with #902, but otel.enabled is false everywhere
      and otelCollector.backendEndpoint is empty, so end-to-end traces are
      still zero. This item is the observability critical path now, not the
      collector.

