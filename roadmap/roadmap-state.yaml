  - id: cloudflare.zone-authority
    title: Zone roots on shared remote state
    epic: mctlhq/.github#47
    issue: mctlhq/mctl-gitops#1178
    phase: now
    expected:
      issue: open
    probes:
      - id: zone-roots-still-local
        kind: file_line_match_count
        repo: mctlhq/mctl-gitops
        path: infrastructure/cloudflare/.local-state-roots
        # That file writes its entries as `infrastructure/cloudflare/zones/...`
        # — both spellings are accepted by the tooling that reads it, and it
        # uses the long one. `^zones/` therefore matched nothing, the count was
        # zero, `== 0` was satisfied, and this item was green from the day it
        # was written while its own note said three zone roots are still local.
        # A regex that is valid, evaluated, and asks the wrong question is
        # invisible to every guard here.
        #
        # The comment lines naming the same roots must not be counted, hence
        # the leading-hash exclusion.
        pattern: '^(?!\s*#)\s*(?:\./)?(?:infrastructure/cloudflare/)?zones/'
        expect: '== 0'
        # The file naming roots that are NOT on the shared backend is the
        # natural thing to delete once none are. Without saying so, this
        # item's success state would be unreachable: the day the migration
        # lands, file_text 404s and the row is OBSERVATION_FAILED forever.
        when_absent: zero
    note: >-
      Only the `account` root is on the shared R2 backend. Until the three
      zone roots follow, Git is the source of truth for one root out of four.

