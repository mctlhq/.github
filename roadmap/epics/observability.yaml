apiVersion: roadmap.mctl.ai/v1alpha1
kind: EpicDefinition
metadata:
  name: observability
  owner: mctl-gitops
  labels:
    - roadmap
spec:
  title: Vendor-neutral execution tracing for agents and DevLoop
  goal: >-
    Make mctl executions observable as correlated OpenTelemetry traces through a
    vendor-neutral OTLP boundary, with canonical execution identity, backend
    portability and no private payload recording by default.
  lifecycle: active
  github:
    issue:
      repository: mctlhq/.github
      number: 55
  phases:
    - id: gateway
      title: Telemetry gateway
    - id: backend
      title: Backend selection and validation
    - id: tracing
      title: End-to-end execution tracing
    - id: correlation
      title: Cross-system correlation
  workItems:
    - id: telemetry-gateway
      phase: gateway
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 902

    - id: attribute-catalog
      phase: gateway
      required: true
      issue:
        repository: mctlhq/mctl-docs
        number: 116
      dependsOn:
        - telemetry-gateway

    - id: backend-bakeoff
      title: Evaluate tracing backends on paper and define the live validation rubric
      phase: backend
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 903
      dependsOn:
        - telemetry-gateway

    - id: devloop-traces
      phase: tracing
      required: true
      issue:
        repository: mctlhq/mctl-agents
        number: 195
      # The producer code is merged (#466); what remains is live evidence: one
      # real DevLoop rendered end to end in a trace backend. That needs a
      # running backend (live-bakeoff) and a collector that keeps the token
      # counts (mctl-gitops#1332), so without these edges the graph reported
      # this item as ready while no autonomous work on it was possible.
      dependsOn:
        - telemetry-gateway
        - live-bakeoff
      externalDependsOn:
        - repository: mctlhq/mctl-agents
          number: 196
        - repository: mctlhq/mctl-gitops
          number: 1332

    - id: agent-traces
      phase: tracing
      required: true
      issue:
        repository: mctlhq/mctl-agent
        number: 38
      dependsOn:
        - telemetry-gateway
      externalDependsOn:
        - repository: mctlhq/mctl-agents
          number: 196

    - id: mcp-span-context
      title: Propagate canonical execution and span context through mctl-api MCP operations
      owner: mctl-api
      phase: correlation
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 285
      # Span-context propagation is independently testable against the
      # Collector debug exporter. Do not serialize it behind the full DevLoop
      # live trace; both branches converge at cross-system-correlation.
      dependsOn:
        - telemetry-gateway
        - attribute-catalog

    - id: cross-system-correlation
      phase: correlation
      required: true
      issue:
        repository: mctlhq/mctl-agent
        number: 97
      dependsOn:
        - devloop-traces
        - agent-traces
        - mcp-span-context

    # Owner decision 2026-10-10: the live evaluation is Tempo-only. The paper
    # screen already found no reason to spend scarce cluster memory running five
    # backends, and the ADR's fallback rule selects Tempo when there is no clear
    # alternative winner. Keep the historical id for roadmap stability; this
    # item is now the live Tempo proof/soak, not a multi-vendor bake-off.
    - id: live-bakeoff
      title: Validate Tempo monolithic on live traffic and record the backend decision
      phase: backend
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 1280
      dependsOn:
        - backend-bakeoff

  completion:
    mode: allRequired
  successCriteria:
    - OTel Collector is the only application-side telemetry boundary.
    - One complete DevLoop is visible as a single correlated trace.
    - One mctl-agent diagnosis links alert, Loki evidence and execution trace.
    - Span attributes reuse canonical execution identity and documented mctl conventions.
    - Backend selection is recorded in an ADR backed by live Tempo validation evidence.
    - Private prompts, completions and Telegram message bodies remain out of traces by default.
    - Replacing the backend requires Collector configuration rather than producer code changes.
