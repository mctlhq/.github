apiVersion: roadmap.mctl.ai/v1alpha1
kind: EpicDefinition
metadata:
  name: human-input
  owner: mctl-agents
  labels:
    - roadmap
spec:
  title: Durable agent clarification / feedback primitive
  goal: >-
    Allow an agent to suspend durable work, ask an authorized human for missing
    information, and resume the same WorkItem without treating clarification as
    approval.
  lifecycle: active
  github:
    issue:
      repository: mctlhq/.github
      number: 42
    issueType: Epic
  phases:
    - id: core
      title: Core durable contract
    - id: api
      title: Platform API and read model
    - id: surfaces
      title: Human-facing adapters
    - id: e2e
      title: End-to-end continuation proof
  workItems:
    - id: human-input-core
      phase: core
      required: true
      issue:
        repository: mctlhq/mctl-agents
        number: 333

    # The core is inert until the catalog profile declares the tool, and the
    # profile bump is a reviewed gitops change rather than a task inside the
    # implementer PR. It is a required rollout that follows the core.
    - id: catalog-profile-rollout
      phase: core
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 1277
      dependsOn:
        - human-input-core

    - id: human-input-api
      phase: api
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 261
      dependsOn:
        - human-input-core

    - id: telegram-adapter
      phase: surfaces
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 571
      dependsOn:
        - human-input-core
        - human-input-api
      externalDependsOn:
        - repository: mctlhq/mctl-telegram
          number: 443
        # The bot is a service principal; mctl-api#261 refuses service
        # answers, so a relayed reply needs the linked human as subject.
        - repository: mctlhq/mctl-api
          number: 350

    - id: portal-card
      phase: surfaces
      required: false
      issue:
        repository: mctlhq/mctl-portal
        number: 124
      dependsOn:
        - human-input-api
      externalDependsOn:
        # The portal holds only a service token; the answer action needs the
        # signed-in human as the delegated subject.
        - repository: mctlhq/mctl-api
          number: 350

    - id: docs
      phase: surfaces
      required: false
      issue:
        repository: mctlhq/mctl-docs
        number: 106
      dependsOn:
        - human-input-core
        - human-input-api

    # The round trip cannot be proven while the tool is ineligible, so the
    # catalog rollout is a prerequisite of the proof even though it is not one
    # of the adapter. Without this edge the proof reads startable before an
    # investigator could invoke the tool at all.
    - id: devloop-e2e
      title: Prove investigator to human to automatic continuation
      owner: mctl-agents
      phase: e2e
      required: true
      issue:
        repository: mctlhq/mctl-agents
        number: 473
      dependsOn:
        - telegram-adapter
        - catalog-profile-rollout
  completion:
    mode: allRequired
  successCriteria:
    - HumanInputRequest and HumanInputResponse are versioned durable contracts.
    - WAITING_FOR_INPUT remains distinct from WAITING_FOR_APPROVAL.
    - No model or Argo pod stays alive solely while waiting for a human.
    - An authorized response resumes the same WorkItem and workflow.
    - The response becomes attributed evidence and produces a new immutable ContextSnapshot.
    - Retry or replay cannot duplicate the question or consume the same response twice.
    - Clarification never satisfies a separate consequential-action approval gate.
