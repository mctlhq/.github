apiVersion: roadmap.mctl.ai/v1alpha1
kind: EpicDefinition
metadata:
  name: client-lifecycle
  owner: mctl-telegram
  labels:
    - roadmap
spec:
  title: Client onboarding and product communication
  goal: >-
    Model client identity, reachability and notification preferences, then build
    a consent-aware, previewable and audited path for product communication
    without granting a model direct broadcast authority.
  lifecycle: active
  github:
    issue:
      repository: mctlhq/.github
      number: 22
  phases:
    - id: identity
      title: Operator identity lookup
    - id: lifecycle
      title: Reachability and preferences
    - id: broadcast
      title: Safe broadcast control path
    - id: updates
      title: Curated product-update feed
    - id: onboarding
      title: Integrated onboarding and communication lifecycle
  workItems:
    # The mctl-telegram half of #400 is delivered (#511 added the admin:users
    # lookup tier, #575 documented it). What remains is the deployment half in
    # mctl-gitops#1182, so that is the work item, and #400 is the parent bug
    # that closes behind it. Modelling #400 as the open implementation item made
    # it look startable when there is no code left to write in that repository.
    - id: lookup-deployment
      phase: identity
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 1182

    - id: operator-identity-lookup
      phase: identity
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 400
      dependsOn:
        - lookup-deployment

    - id: client-reachability-preferences
      phase: lifecycle
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 438

    - id: login-bot-update-receiver
      phase: broadcast
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 619
      dependsOn:
        - client-reachability-preferences

    - id: safe-broadcast
      phase: broadcast
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 439
      dependsOn:
        - client-reachability-preferences
        - login-bot-update-receiver

    - id: product-update-feed
      phase: updates
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 440
      dependsOn:
        - safe-broadcast

    - id: onboarding-integration
      title: Integrate identity, consent, reachability and product communication into the client lifecycle
      owner: mctl-telegram
      phase: onboarding
      required: true
      dependsOn:
        - operator-identity-lookup
        - safe-broadcast
        - product-update-feed
  completion:
    mode: allRequired
  successCriteria:
    - Operator-facing identity lookup is scoped, auditable and privacy-safe.
    - Authentication, bot reachability and notification consent remain separate concepts.
    - Product updates require explicit category-level user choice.
    - Broadcast preview and approval bind exact content and audience.
    - Delivery is rate-limited, idempotent, cancellable and audited.
    - Capability claims originate from deterministic release/tool evidence.
