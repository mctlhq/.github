# Filed 2026-10-30 after two incidents on the connector login path that the
# tool-path canary could not see: the Cloudflare connector-UA 403 (29.10,
# mctl-gitops#2261) and MCP refused on the bare origin (30.10,
# mctl-telegram#957).
#
# Pivoted 2026-10-31 after live investigation showed that Telegram's test DC
# still accepts our api_id but no longer gives us a usable account to log in
# with. The guarded TG_TEST_DC transport remains valid, and mctl-telegram#963
# stays open as a reactivation path, but it is not a completion dependency.
# Full-login evidence now uses low-frequency production-DC proofs on a
# dedicated service account (mctl-telegram#1057), never scheduled phone logins.
apiVersion: roadmap.mctl.ai/v1alpha1
kind: EpicDefinition
metadata:
  name: login-path-observability
  owner: mctl-telegram
  labels:
    - roadmap
spec:
  title: Observe the connector login path, not only connected accounts
  goal: >-
    Detect breakage anywhere on the path a new MCP connector takes into
    mctl-telegram (discovery, Telegram OIDC, phone or QR step, token grant,
    first MCP call, and the edge in front of it) within 30 minutes using
    continuous synthetic/funnel detectors, plus low-frequency live evidence on
    dedicated Telegram service accounts, and stop the monitoring canary from
    being broken by an accidental Disconnect.
  lifecycle: active
  github:
    issue:
      repository: mctlhq/.github
      number: 279
  phases:
    - id: synthetic
      title: Synthetic probes of every login hop up to the Telegram boundary
    - id: funnel
      title: Real-user login funnel signals
    - id: alerting
      title: Alerts and runbook for both
    - id: hardening
      title: Canary account guard
    - id: live-integration
      title: Low-frequency live MTProto integration evidence
    - id: live-login
      title: Low-frequency live Telegram login evidence
  workItems:
    - id: canary-login-path
      title: Canary probes of the connector login path
      owner: mctl-telegram
      phase: synthetic
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 959
      externalDependsOn:
        - repository: mctlhq/mctl-telegram
          number: 957

    - id: funnel-signals
      title: Login funnel signals (token without first MCP call, callback rejections)
      owner: mctl-telegram
      phase: funnel
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 960

    - id: alerts
      title: Alerts and runbook for the login-path canary and funnel
      owner: mctl-gitops
      phase: alerting
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 2276
      dependsOn:
        - canary-login-path
        - funnel-signals

    - id: canary-account-guard
      title: Guard the canary account against accidental Disconnect
      owner: mctl-telegram
      phase: hardening
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 961

    - id: live-mtproto-roundtrip
      title: Guarded test-DC mode plus live service-account message-tool round trip
      owner: mctl-telegram
      phase: live-integration
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 854

    - id: live-login-proof
      title: Low-frequency live Telegram login proof on a dedicated service account
      owner: mctl-telegram
      phase: live-login
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 1057
      dependsOn:
        - live-mtproto-roundtrip

  # mctl-telegram#963 is intentionally not a work item while Telegram test-DC
  # account provisioning is unavailable. It remains open as BLOCKED_BY_TELEGRAM
  # and can be restored to the graph if a reproducible test-account login path
  # becomes available again.
  completion:
    mode: allRequired
  successCriteria:
    - Re-introducing an edge 403 for connector User-Agents, or refusing MCP on the bare origin, turns a detector red within 30 minutes, proven by mutation or preview evidence.
    - A connector that obtains a token but never completes a successful MCP call is durably visible and alerts only above a minimum-volume floor.
    - Disconnecting, deleting or revoking the monitoring canary account requires an explicit override and is auditable.
    - A dedicated live service account proves send, edit, forward and delete through the real production-DC client path at low frequency without re-login on every run.
    - Full login is proven through mctl-telegram#1057: on-demand QR through the production-DC product code path plus one bounded operator-assisted phone/code/2FA proof; repeated automated phone login is not required.
    - The unavailable Telegram test-DC account path in mctl-telegram#963 cannot block completion and remains parked until Telegram restores a reproducible test-account login path.
