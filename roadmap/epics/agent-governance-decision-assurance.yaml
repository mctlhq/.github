    "successCriteria": [
      "A proposal rewrite cannot leave a stale human-decidable approval grant, and approval refusal/failure has typed non-success terminal and retry semantics.",
      "Every governed human approval, including direct GitOps approval, binds the exact content reviewed before the decision is recorded.",
      "Manual, Temporal and autonomous execution entry points use one execution-authorization contract and cannot disagree about whether an action is authorized.",
      "The canonical policy approval checkpoint is explicitly enabled or enforceably classified for every supported governed path; normal transports cannot bypass it.",
      "Decision-time authority/context and execution-time freshness/revalidation semantics are explicit and tested for permission, expiry and policy drift.",
      "A durable typed record reconstructs intent -> policy -> authority/approval -> exact action -> execution attempts -> terminal result without relying on sampled telemetry.",
