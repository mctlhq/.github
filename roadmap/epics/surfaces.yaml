apiVersion: roadmap.mctl.ai/v1alpha1
kind: EpicDefinition
metadata:
  name: surfaces
  owner: mctl-api
  labels:
    - roadmap
spec:
  title: Cross-surface working context and agentic UX
  goal: >-
    Keep durable work state in the platform so a WorkItem can be inspected and
    resumed across Telegram, MCP, CLI and web surfaces without replaying raw
    conversation history or inheriting privileges across surfaces.
  lifecycle: active
  github:
    issue:
      repository: mctlhq/.github
      number: 21
  phases:
    - id: contract
      title: Canonical WorkItem and surface contract
    - id: resume
      title: Resume across surfaces
    - id: continuity
      title: Context continuity
    - id: ux
      title: Agentic work-item UX
  workItems:
    - id: work-item-contract
      phase: contract
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 227

    - id: investigator-resume
      phase: resume
      required: true
      issue:
        repository: mctlhq/mctl-agents
        number: 267
      dependsOn:
        - work-item-contract
      externalDependsOn:
        - repository: mctlhq/mctl-agents
          number: 264
        # The submission path needs both before it can carry the identifiers.
        - repository: mctlhq/mctl-gitops
          number: 1279
        - repository: mctlhq/mctl-api
          number: 335

    # work-item-contract (#227) closed on an accepted DESIGN; its own
    # "Implementation status" says nothing of it is built. The runtime API is
    # a separate node so consumers cannot read the closed design issue as a
    # usable API.
    - id: work-item-api
      title: Implement the canonical workitem/v1 REST API
      owner: mctl-api
      phase: contract
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 349
      dependsOn:
        - work-item-contract

    # Surfaces reach mctl-api as a service principal; the human behind the
    # surface becomes the actor only through a link the human created
    # (SurfaceIdentityLink). Shared by the Telegram WorkItem adapter here and,
    # in the human-input epic, by the Telegram reply adapter and portal card.
    - id: surface-identity-link
      title: Delegated surface identity for surface-relayed actions
      owner: mctl-api
      phase: contract
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 350
      dependsOn:
        - work-item-contract

    # mctl-telegram#443 states its own prerequisites as #227 AND mctl-agents#267:
    # the adapter binds Telegram threads to the WorkItem that the investigator
    # resume path defines, so the contract alone is not enough to start it.
    # It also needs the runtime API and a way to act as the linked human.
    - id: telegram-work-item-adapter
      phase: resume
      required: true
      issue:
        repository: mctlhq/mctl-telegram
        number: 443
      dependsOn:
        - work-item-contract
        - work-item-api
        - surface-identity-link
        - investigator-resume

    - id: second-surface-pilot
      title: Resume the same WorkItem from a second non-Telegram surface
      owner: mctl-api
      phase: resume
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 341
      dependsOn:
        - work-item-api
        - investigator-resume
        - telegram-work-item-adapter

    - id: working-memory-continuity
      title: Derive new immutable ContextSnapshots when a WorkItem resumes
      owner: mctl-agents
      phase: continuity
      required: true
      issue:
        repository: mctlhq/mctl-agents
        number: 431
      dependsOn:
        - investigator-resume
        # Its acceptance resumes a live WorkItem; the resume client calls
        # GET /api/v1/work-items/{id}, which only work-item-api provides.
        - work-item-api
      externalDependsOn:
        - repository: mctlhq/mctl-agents
          number: 265

    - id: agentic-work-item-ux
      title: Present durable work state, blockers, evidence and next actions as a first-class UX
      owner: mctl-portal
      phase: ux
      required: true
      issue:
        repository: mctlhq/mctl-portal
        number: 126
      dependsOn:
        - second-surface-pilot
        - working-memory-continuity
  completion:
    mode: allRequired
  successCriteria:
    - WorkItem is the canonical durable work object rather than a surface conversation.
    - Stable identifiers correlate surface interactions, executions and ContextSnapshots.
    - One investigation is resumed across two surfaces without replaying raw chat history.
    - Every surface transition re-evaluates actor identity and policy.
    - Historical execution context stays immutable across resume.
