apiVersion: roadmap.mctl.ai/v1alpha1
kind: EpicDefinition
metadata:
  name: unified-identity
  owner: mctl-api
  labels:
    - roadmap
spec:
  title: MCTL Unified Identity and Agent Identity Broker
  goal: >-
    Decouple MCTL principals from GitHub identity by introducing stable canonical
    identities for humans, agents and services, with linked external identities,
    swappable federation, CIMD-aware MCP OAuth and delegated agent identity.
  lifecycle: active
  github:
    issue:
      repository: mctlhq/.github
      number: 91
  phases:
    - id: principal
      title: Canonical principal model
    - id: federation
      title: Identity federation and broker
    - id: mcp
      title: MCP OAuth and CIMD integration
    - id: delegation
      title: Agent and delegated identity
    - id: migration
      title: GitHub identity decoupling
  workItems:
    - id: principal-model
      title: Define canonical human, agent and service principals plus linked external identities
      owner: mctl-api
      phase: principal
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 373

    # The provider registry and first production provider are already real, but
    # #374 deliberately split its accepted design into separately mergeable
    # slices. Keep this required item open until those remaining federation
    # slices are explicitly completed or moved to follow-ups by owner decision;
    # do not equate "ZITADEL works" with the whole #374 contract being done.
    - id: identity-federation
      title: Complete the swappable OIDC federation boundary and migration contract
      owner: mctl-api
      phase: federation
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 374
      dependsOn:
        - principal-model

    - id: mcp-oauth-cimd
      title: Separate MCP client identity from user principal identity and integrate CIMD
      owner: mctl-api
      phase: mcp
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 375
      dependsOn:
        - principal-model
        - identity-federation

    - id: delegated-agent-identity
      title: Represent agent actor and on-behalf-of subject distinctly for policy and audit
      owner: mctl-agents
      phase: delegation
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 376
      dependsOn:
        - principal-model

    - id: github-decoupling
      title: Migrate tenant membership and authorization away from canonical GitHub identity
      owner: mctl-api
      phase: migration
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 377
      dependsOn:
        - identity-federation
        - mcp-oauth-cimd
        - delegated-agent-identity
        - zitadel-identity-linking

    # Identity provider decision (owner, 2026-10-03): the human identity
    # provider is self-hosted ZITADEL. It is one more OIDC entry in the
    # federation registry (MCTL_OIDC_PROVIDERS, mctl-api#374 slice A), not a
    # broker in front of every request, so the #374 design rationale stands:
    # static service tokens, local MCP OAuth JWTs and GitHub PATs stay
    # verified by mctl-api itself. ZITADEL replaces Argo CD's embedded Dex
    # (ops.mctl.ai/api/dex) as the source of human sign-in.
    - id: zitadel-deployment
      title: Run self-hosted ZITADEL as the MCTL human identity provider (Postgres, Vault-held secrets, backups, alerting)
      owner: mctl-gitops
      phase: federation
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 1499

    - id: zitadel-federation-provider
      title: Register ZITADEL in the mctl-api federation registry with per-provider issuer and enforced audience
      owner: mctl-api
      phase: federation
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 434
      dependsOn:
        - identity-federation
        - zitadel-deployment
        - platform-host-reservation

    # Linking is an explicit action, never by spelling (#373 decision,
    # 2026-09-24): an existing GitHub or Dex principal gains a ZITADEL
    # identity only through a verified link, not a name match. The core browser
    # flow and admin merge implementation landed in mctl-api#446; this work
    # item remains open until the client/wiring and a live link proof establish
    # that existing principals can actually use the path in production.
    - id: zitadel-identity-linking
      title: Ship and prove explicit ZITADEL identity linking for existing principals
      owner: mctl-api
      phase: migration
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 435
      dependsOn:
        - principal-model
        - zitadel-federation-provider

    - id: zitadel-platform-sso
      title: Move Argo CD, the portal and Cloudflare Access sign-in from Dex and Google to ZITADEL
      owner: mctl-gitops
      phase: migration
      required: false
      issue:
        repository: mctlhq/mctl-gitops
        number: 1500
      dependsOn:
        - zitadel-deployment

    - id: tenant-app-sso
      title: Offer tenant applications sign-in through a per-tenant ZITADEL organization
      owner: mctl-gitops
      phase: federation
      required: false
      issue:
        repository: mctlhq/mctl-gitops
        number: 1501
      dependsOn:
        - zitadel-deployment
        - tenant-domain-separation

    # auth.mctl.ai shares the registrable domain mctl.ai with tenant
    # applications, so browsers treat them as one site (cookie tossing,
    # SameSite gives no separation). Accepted for ZITADEL phase 1 only while
    # nothing signs in through it (mctl-gitops docs/runbooks/zitadel.md).
    - id: platform-host-reservation
      title: Reserve platform hostnames on *.mctl.ai at admission so no tenant can claim auth.mctl.ai
      owner: mctl-gitops
      phase: federation
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 1503

    - id: tenant-domain-separation
      title: Move tenant applications to a separate registrable domain listed in the Public Suffix List
      owner: mctl-gitops
      phase: migration
      required: false
      issue:
        repository: mctlhq/mctl-gitops
        number: 1504
      dependsOn:
        - platform-host-reservation
  completion:
    mode: allRequired
  successCriteria:
    - MCTL principal identity is independent of GitHub username and email.
    - Human, agent and service principals use stable canonical subjects.
    - External identities are linked by issuer and subject.
    - GitHub is an integration and capability provider rather than canonical platform identity.
    - MCP OAuth keeps CIMD client identity distinct from the human or service principal.
    - Tenant membership and authorization resolve against canonical MCTL principals.
    - Agent actions distinguish the acting agent from the on-behalf-of subject.
    - The federation provider can change without changing the MCTL authorization model.
    - Human sign-in to MCTL goes through self-hosted ZITADEL; GitHub and Google are linked upstream identities.
