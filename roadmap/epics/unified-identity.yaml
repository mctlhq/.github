apiVersion: roadmap.mctl.ai/v1alpha1
kind: EpicDefinition
metadata:
  name: unified-identity
  owner: mctl-api
  labels:
    - roadmap
spec:
  title: MCTL Unified Identity on ZITADEL and Agent Identity
  goal: >-
    Complete MCTL's canonical principal and authorization model on top of the
    already deployed ZITADEL human identity provider, keeping external provider
    identities, MCP client identity and delegated agent identity distinct and
    auditable while removing GitHub-login coupling from tenant authorization.
  lifecycle: completed
  github:
    issue:
      repository: mctlhq/.github
      number: 91
  phases:
    - id: principal
      title: Canonical principal model
    - id: federation
      title: Human identity and authentication boundary
    - id: mcp
      title: MCP OAuth and CIMD integration
    - id: delegation
      title: Agent and delegated identity
    - id: migration
      title: Canonical authorization migration
  workItems:
    - id: principal-model
      title: Define canonical human, agent and service principals plus linked external identities
      owner: mctl-api
      phase: principal
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 373

    - id: identity-federation
      title: Provide a provider-agnostic authentication boundary for ZITADEL and legacy credentials
      owner: mctl-api
      phase: federation
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 374
      dependsOn:
        - principal-model

    - id: mcp-oauth-cimd
      title: Add CIMD while keeping MCP client identity separate from ZITADEL user identity
      owner: mctl-api
      phase: mcp
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 375
      dependsOn:
        - principal-model
        - identity-federation

    - id: delegated-agent-identity
      title: Finish canonical agent actor and on-behalf-of identity for policy and audit
      owner: mctl-agents
      phase: delegation
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 376
      dependsOn:
        - principal-model

    # Human tenant membership does not depend on MCP client registration or on
    # delegated-agent rollout. Once canonical principals, the authentication
    # boundary and verified ZITADEL linking exist, the authorization cut-over
    # can run in parallel with CIMD and agent identity.
    - id: github-decoupling
      title: Authorize tenant membership by canonical principal instead of GitHub login
      owner: mctl-api
      phase: migration
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 377
      dependsOn:
        - principal-model
        - identity-federation
        - zitadel-identity-linking

    # Owner decision (2026-10-03): self-hosted ZITADEL is the platform human
    # identity provider. It is an OIDC provider in mctl-api's federation
    # registry, not a broker in front of every credential. Static service
    # tokens, MCTL local OAuth JWTs and supported legacy GitHub credentials
    # continue to terminate in mctl-api through the authentication boundary.
    - id: zitadel-deployment
      title: Run self-hosted ZITADEL as the MCTL human identity provider (Postgres, Vault-held secrets, backups, alerting)
      owner: mctl-gitops
      phase: federation
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 1499

    - id: zitadel-federation-provider
      title: Register ZITADEL in the mctl-api federation registry with per-provider issuer and enforced audience
      owner: mctl-api
      phase: federation
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 434
      dependsOn:
        - identity-federation
        - zitadel-deployment
        - platform-host-reservation

    # Linking is explicit and verified, never inferred from matching username or
    # e-mail: a GitHub/Dex and ZITADEL identity share authority only when both
    # are linked to the same canonical principal.
    - id: zitadel-identity-linking
      title: Link existing GitHub and Dex principals to their ZITADEL identities through an explicit, verified flow
      owner: mctl-api
      phase: migration
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 435
      dependsOn:
        - principal-model
        - zitadel-federation-provider

    - id: zitadel-platform-sso
      title: Move Argo CD, the portal and Cloudflare Access sign-in from Dex and Google to ZITADEL
      owner: mctl-gitops
      phase: migration
      required: false
      issue:
        repository: mctlhq/mctl-gitops
        number: 1500
      dependsOn:
        - zitadel-deployment

    - id: tenant-app-sso
      title: Offer tenant applications sign-in through a per-tenant ZITADEL organization
      owner: mctl-gitops
      phase: federation
      required: false
      issue:
        repository: mctlhq/mctl-gitops
        number: 1501
      dependsOn:
        - zitadel-deployment
        - tenant-domain-separation

    - id: platform-host-reservation
      title: Reserve platform hostnames on *.mctl.ai at admission so no tenant can claim auth.mctl.ai
      owner: mctl-gitops
      phase: federation
      required: true
      issue:
        repository: mctlhq/mctl-gitops
        number: 1503

    - id: tenant-domain-separation
      title: Move tenant applications to a separate registrable domain listed in the Public Suffix List
      owner: mctl-gitops
      phase: migration
      required: false
      issue:
        repository: mctlhq/mctl-gitops
        number: 1504
      dependsOn:
        - platform-host-reservation

    # Legacy GitHub local-OAuth compatibility/efficiency follow-up. This is not
    # needed for ZITADEL, CIMD or the canonical authorization cut-over.
    - id: github-local-oauth-ghid
      title: Carry numeric GitHub id in legacy local OAuth JWTs
      owner: mctl-api
      phase: migration
      required: false
      issue:
        repository: mctlhq/mctl-api
        number: 422
      dependsOn:
        - identity-federation
  completion:
    mode: allRequired
  successCriteria:
    - Human authentication uses self-hosted ZITADEL while MCTL authorization is keyed by stable canonical principals.
    - Human, agent and service principals use stable canonical subjects independent of usernames and e-mails.
    - External identities are linked by provider, issuer and subject and do not become authorization keys by themselves.
    - A linked ZITADEL and GitHub identity for the same human resolve to the same tenant authorization.
    - GitHub is an integration and capability provider rather than canonical platform identity.
    - MCP OAuth keeps CIMD/DCR client identity distinct from the human or service principal.
    - Tenant membership and authorization resolve against canonical MCTL principals and fail closed when required identity cannot be resolved.
    - Agent actions distinguish the acting agent from a server-derived on-behalf-of subject.
    - Replacing the human IdP in the future does not require changing the MCTL authorization model.
