apiVersion: roadmap.mctl.ai/v1alpha1
kind: EpicDefinition
metadata:
  name: roadmap-control-plane
  owner: mctlhq/.github
  labels:
    - roadmap
spec:
  title: Declarative EpicDefinition and GitHub graph reconciliation
  goal: >-
    Make a versioned EpicDefinition manifest the canonical desired graph for an epic,
    and derive drift, health and completion from the observed GitHub graph
    deterministically, with GitHub remaining the human planning surface.
  lifecycle: active
  github:
    issue:
      repository: mctlhq/.github
      number: 66
  phases:
    - id: detect
      title: Read-only reconciliation
    - id: health
      title: Derived snapshot health
    - id: apply
      title: Governed apply
    - id: temporal
      title: Temporal health
    - id: waves
      title: Dependency-aware wave planning and launch
  workItems:
    - id: reconciler
      phase: detect
      required: true
      issue:
        repository: mctlhq/.github
        number: 67

    - id: roadmap-health
      phase: health
      required: true
      issue:
        repository: mctlhq/.github
        number: 83
      dependsOn:
        - reconciler

    - id: governed-apply
      phase: apply
      required: true
      issue:
        repository: mctlhq/.github
        number: 68
      dependsOn:
        - reconciler

    # Deliberately non-blocking: temporal health needs a notion of "now", which the
    # deterministic reconciler and RoadmapHealth exclude. It stays visible in the graph
    # but never holds allRequired completion back.
    - id: temporal-health
      phase: temporal
      required: false
      issue:
        repository: mctlhq/.github
        number: 85
      dependsOn:
        - roadmap-health

    - id: ready-work-items
      phase: waves
      required: true
      issue:
        repository: mctlhq/.github
        number: 99
      dependsOn:
        - reconciler
        - roadmap-health

    # The evaluator runs only here; consumers read its versioned output from
    # the generated roadmap-state branch and never re-evaluate.
    - id: roadmap-publication
      title: Publish a versioned RoadmapPublication to the roadmap-state branch
      owner: mctlhq/.github
      phase: waves
      required: true
      issue:
        repository: mctlhq/.github
        number: 119
      dependsOn:
        - ready-work-items
        - roadmap-health

    - id: epic-status-api
      phase: waves
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 333
      dependsOn:
        - ready-work-items
        - roadmap-publication

    - id: governed-wave-start
      phase: waves
      required: true
      issue:
        repository: mctlhq/mctl-api
        number: 334
      dependsOn:
        - ready-work-items
        - epic-status-api
  completion:
    mode: allRequired
  successCriteria:
    - EpicDefinition v1alpha1 schema and semantic validator reject cycles, unknown references and duplicate bindings.
    - Read-only reconciliation compares a manifest with the live GitHub graph and produces deterministic drift.
    - Converged and mutated fixtures prove the detector in both directions.
    - Unobserved or unreadable state is never reported as absent, drifted or silent.
    - RoadmapHealth and allRequired completion are computed, not authored.
    - Governed apply uses deterministic GitHub operations bound to the exact manifest hash.
    - Dependency-aware readiness is derived from EpicDefinition and observed issue state, never from operator memory.
    - MCP clients can inspect epic status and exact ready work items without reconstructing the graph.
    - An explicit wave start launches only currently ready, bound work items and never auto-approves proposals.
    - GitHub remains the planning UI; the manifest is the canonical desired graph.
