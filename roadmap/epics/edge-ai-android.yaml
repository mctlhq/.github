apiVersion: roadmap.mctl.ai/v1alpha1
kind: EpicDefinition
metadata:
  name: edge-ai-android
  owner: mctl-agents
  labels:
    - roadmap
    - edge-ai
    - android
spec:
  title: Edge AI on Android
  goal: >-
    Evaluate whether an Android phone can be the execution device for a governed mctl agent
    without weakening identity, policy, evidence or remote fallback semantics. The device
    holds the TDLib session, the on-device model and the local policy gate itself, with no
    Local Bridge and no hosted agent in the loop, so private chats never leave the phone.
  # Archived 2026-10-23 on the feasibility-spike verdict (mctl-agents#652):
  # criterion 1 (tool-call correctness under injection) failed on every
  # runtime measured (Gemma 4 E2B TPU, E4B GPU, Pixel 7 E2B GPU, Qwen3.5-4B
  # CPU), and criteria 2 and 3 (latency, memory) were far outside bounds.
  # The decision rule in #652 says any failed criterion archives the epic
  # with the measurements kept. Reopen by a new spike, not by flipping this.
  lifecycle: archived
  github:
    issue:
      repository: mctlhq/.github
      number: 34
    issueType: Epic
    project:
      priority: PARK
  phases:
    - id: feasibility
      title: Runtime and device feasibility
    - id: contract
      title: Governed local execution contract
  workItems:
    - id: feasibility-spike
      title: Evaluate on-device tool-calling loop over Telegram tool schemas on a Pixel 10 Pro
      owner: mctlhq/mctl-agents
      phase: feasibility
      required: true
      issue:
        repository: mctlhq/mctl-agents
        number: 652
    - id: local-execution-contract
      title: Define identity, capability, policy and evidence boundary for local execution
      owner: mctlhq/mctl-agents
      phase: contract
      required: true
      dependsOn:
        - feasibility-spike
  completion:
    mode: allRequired
  successCriteria:
    - A feasibility result identifies supported Android inference/runtime paths and hard blockers.
    - Local execution preserves canonical mctl principal and agent identity.
    - Device-local capabilities remain explicitly policy-gated and auditable.
    - Local execution can fail closed or fall back remotely without hidden privilege changes.
    - No implementation vendor or model runtime is made canonical before the feasibility result.
